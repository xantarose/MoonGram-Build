name: MoonGram public template (no private API keys)
on:
  push:
    branches: ['codex/ipa-release']
  workflow_dispatch:
    inputs:
      kind:
        description: 'Template for local configuration, or simulator launch check'
        type: choice
        options: [standalone-device, standalone-simulator]
        default: standalone-device
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare nonfunctional placeholder API values
        env:
          BUILD_KIND: ${{ inputs.kind || 'standalone-device' }}
        run: python3 tools/build_configuration.py --kind "$BUILD_KIND" --template
      - name: Test IPA packaging before the full build
        run: |
          python3 tools/prepare.py
          python3 -m unittest discover -s tools/tests
      - name: Compile the default MoonGram icon before the full build
        run: python3 tools/check_app_icons.py --compile
      - name: Check disk space for the public Bazel cache
        id: bazel-cache
        continue-on-error: true
        if: ${{ github.event.repository.private == false && (inputs.kind || 'standalone-device') == 'standalone-device' }}
        shell: bash
        run: |
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          printf 'Free disk space before the build: %s KiB\n' "$free_kib"
          if [ "$free_kib" -ge 10485760 ]; then
            xcode_key=$(xcodebuild -version | shasum -a 256 | cut -c 1-12)
            printf 'xcode=%s\nenabled=true\n' "$xcode_key" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Bazel compilation results
        id: bazel-restore
        if: steps.bazel-cache.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/moongram-bazel-cache
          key: moongram-bazel-v2-${{ runner.arch }}-${{ steps.bazel-cache.outputs.xcode }}-${{ hashFiles('upstream.lock.json') }}-${{ hashFiles('patches/*.patch', 'MoonGram/**/*.swift', 'MoonGram/Transport/**/*') }}
          restore-keys: |
            moongram-bazel-v2-${{ runner.arch }}-${{ steps.bazel-cache.outputs.xcode }}-${{ hashFiles('upstream.lock.json') }}-
      - name: Build without real Telegram API credentials
        env:
          BUILD_KIND: ${{ inputs.kind || 'standalone-device' }}
          CACHE_ENABLED: ${{ steps.bazel-cache.outputs.enabled == 'true' && steps.bazel-restore.outcome == 'success' }}
        shell: bash
        run: |
          cache_args=()
          if [ "$CACHE_ENABLED" = true ]; then
            cache_args+=(--cache-dir "$RUNNER_TEMP/moongram-bazel-cache")
          fi
          python3 tools/build.py --configuration build.local.json --kind "$BUILD_KIND" --template \
            --build-number "$((1000 + BUILD_NUMBER))" "${cache_args[@]}"
      - name: Verify icon registrations in the built IPA
        run: python3 tools/check_app_icons.py --ipa dist/MoonGram-template-personal*.ipa
      - name: Launch the complete simulator template
        if: inputs.kind == 'standalone-simulator'
        run: python3 tools/smoke_full_client.py --ipa dist/MoonGram-template-personal-simulator.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MoonGram-public-template-${{ inputs.kind || 'standalone-device' }}
          path: |
            dist/MoonGram-template*.ipa
            dist/MoonGram-template*.json
            dist/full-smoke/
          if-no-files-found: error
          retention-days: 3
      - name: Check the cache size before upload
        id: bazel-size
        continue-on-error: true
        if: steps.bazel-cache.outputs.enabled == 'true' && steps.bazel-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cache="$RUNNER_TEMP/moongram-bazel-cache"
          if [ -d "$cache" ]; then
            size_kib=$(du -sk "$cache" | cut -f1)
            printf 'Bazel cache size: %s KiB\n' "$size_kib"
            if [ "$size_kib" -le 9437184 ]; then
              echo 'save=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Save Bazel compilation results
        if: steps.bazel-size.outputs.save == 'true' && steps.bazel-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 12
        with:
          path: ${{ runner.temp }}/moongram-bazel-cache
          key: ${{ steps.bazel-restore.outputs.cache-primary-key }}
      - name: Remove placeholder configuration
        if: always()
        run: python3 -c 'from pathlib import Path; Path("build.local.json").unlink(missing_ok=True)'
